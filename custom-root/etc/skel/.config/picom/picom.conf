backend = "xrender"; # Для слабого GPU C-70 это важно
active-opacity = 0.95;
inactive-opacity = 0.80;
frame-opacity = 0.80;

# Размытие (только если GPU потянет, на C-70 лучше оставить выключенным)
blur-method = "none";

# Закругление углов (вот это удивит всех на старом железе!)
corner-radius = 8;

fading = true;
fade-delta = 4;
